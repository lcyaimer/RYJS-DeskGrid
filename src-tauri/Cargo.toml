[package]
name = "ryjs-deskgrid"
version = "0.2.6"
description = "RYJS DeskGrid - a lightweight, translucent desktop organizer"
authors = ["lcyaimer"]
license = "MIT"
repository = "https://github.com/lcyaimer/RYJS-DeskGrid"
homepage = "https://github.com/lcyaimer/RYJS-DeskGrid"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ryjs_deskgrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = { version = "5", features = ["shellexecute-on-windows"] }
dirs = "6"
base64 = "0.21"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
